name: Android debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned SDK packages
        run: JAVA_HOME="$JAVA_HOME_21_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle and validate Wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Test release guards without secrets
        run: python3 -m unittest discover -s tools/tests -v
      - name: Validate workflow YAML and expressions
        run: bash tools/check-workflows.sh
      - name: Build and lint debug app
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: memonow-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.run_number }}
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 1
