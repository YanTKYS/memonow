name: Signed release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'YanTKYS/memonow' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ref.outputs.version }}
      code: ${{ steps.ref.outputs.code }}
      commit: ${{ steps.ref.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require matching tag and a commit already on main
        id: ref
        run: python3 tools/release.py check-ref
      - name: Test release guards
        run: python3 -m unittest discover -s tools/tests -v
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: JAVA_HOME="$JAVA_HOME_21_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Test, build and lint without signing secrets
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug

  sign:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Put keys only in this protected environment, with required reviewers and
    # main/v* deployment restrictions. Do not use repository-scoped signing secrets.
    environment: release-signing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: JAVA_HOME="$JAVA_HOME_21_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare private signing file
        env:
          MEMONOW_RELEASE_KEYSTORE_BASE64: ${{ secrets.MEMONOW_RELEASE_KEYSTORE_BASE64 }}
          MEMONOW_RELEASE_STORE_PASSWORD: ${{ secrets.MEMONOW_RELEASE_STORE_PASSWORD }}
          MEMONOW_RELEASE_KEY_ALIAS: ${{ secrets.MEMONOW_RELEASE_KEY_ALIAS }}
          MEMONOW_RELEASE_KEY_PASSWORD: ${{ secrets.MEMONOW_RELEASE_KEY_PASSWORD }}
          MEMONOW_RELEASE_CERT_SHA256: ${{ vars.MEMONOW_RELEASE_CERT_SHA256 }}
        run: python3 tools/prepare-signing.py
      - name: Build and verify signed release
        env:
          MEMONOW_RELEASE_STORE_PASSWORD: ${{ secrets.MEMONOW_RELEASE_STORE_PASSWORD }}
          MEMONOW_RELEASE_KEY_ALIAS: ${{ secrets.MEMONOW_RELEASE_KEY_ALIAS }}
          MEMONOW_RELEASE_KEY_PASSWORD: ${{ secrets.MEMONOW_RELEASE_KEY_PASSWORD }}
          MEMONOW_RELEASE_CERT_SHA256: ${{ vars.MEMONOW_RELEASE_CERT_SHA256 }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          ./gradlew --no-daemon --no-configuration-cache assembleRelease lintRelease
          python3 tools/release.py verify-apk --apk app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/memonow-v${VERSION}.apk"
          (cd dist && sha256sum "memonow-v${VERSION}.apk" > "memonow-v${VERSION}.apk.sha256")
      - name: Remove private signing file
        if: always()
        run: rm -rf "$RUNNER_TEMP/memonow-signing"
      - name: Upload only verified public release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-${{ needs.validate.outputs.version }}
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error
          retention-days: 1

  preview:
    # Manually signed candidates go to an unpublished Draft Release for Android testing.
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified signed APK
        uses: actions/download-artifact$d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-${{ needs.validate.outputs.version }}
          path: dist
      - name: Create Draft Release for device testing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c "memonow-v${VERSION}.apk.sha256")
          # test-v* names never trigger the final v* publication workflow.
          TAG="test-v${VERSION}-run${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}"
          URL=$(gh release create "$TAG" \
            "dist/memonow-v${VERSION}.apk" \
            "dist/memonow-v${VERSION}.apk.sha256" \
            --draft --prerelease --latest=false --target "$COMMIT" \
            --title "memonow v${VERSION} (device test #${GITHUB_RUN_ID})" \
            --notes "Unpublished signed APK for Android device tests. Run: ${GITHUB_RUN_ID}, attempt: ${GITHUB_RUN_ATTEMPT}, commit: ${COMMIT}. Not an official release. Sign in with a repository maintainer account to download. Keep a JSON backup before changing installations.")
          {
            echo "### Unpublished Android test APK"
            echo "Signed APK and SHA-256 are in a **Draft Release** (not public)."
            echo ""
            echo "[Open Draft Release and download APK](${URL})"
            echo ""
            echo "If the link does not open on your phone, sign in with a repository maintainer account."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-${{ needs.validate.outputs.version }}
          path: dist
      - name: Verify files and publish only after assets are attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          (cd dist && sha256sum -c "memonow-v${VERSION}.apk.sha256")
          gh release create "$TAG" "dist/memonow-v${VERSION}.apk" "dist/memonow-v${VERSION}.apk.sha256" --verify-tag --draft --title "memonow $TAG" --notes-file "docs/releases/$TAG.md"
          gh release edit "$TAG" --draft=false
