name: Signed release APK
run-name: "${{ github.event_name == 'push' && 'release / skip' || 'preview' }} / ${{ github.ref_name }}"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-memonow
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'YanTKYS/memonow'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      action: ${{ steps.plan.outputs.action }}
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      code: ${{ steps.plan.outputs.code }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Determine release, skip or optional preview without secrets
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/release_plan.py

  validate:
    needs: plan
    if: needs.plan.outputs.action != 'skip'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test release guards
        run: python3 -m unittest discover -s tools/tests -v
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: JAVA_HOME="$JAVA_HOME_21_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Test, build and lint without signing secrets
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug

  sign:
    needs: [plan, validate]
    outputs:
      certificate: ${{ steps.verify.outputs.certificate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Put keys only in this protected environment, with required reviewers and
    # main/v* deployment restrictions. Do not use repository-scoped signing secrets.
    environment: release-signing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: JAVA_HOME="$JAVA_HOME_21_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare private signing file
        env:
          MEMONOW_RELEASE_KEYSTORE_BASE64: ${{ secrets.MEMONOW_RELEASE_KEYSTORE_BASE64 }}
          MEMONOW_RELEASE_STORE_PASSWORD: ${{ secrets.MEMONOW_RELEASE_STORE_PASSWORD }}
          MEMONOW_RELEASE_KEY_ALIAS: ${{ secrets.MEMONOW_RELEASE_KEY_ALIAS }}
          MEMONOW_RELEASE_KEY_PASSWORD: ${{ secrets.MEMONOW_RELEASE_KEY_PASSWORD }}
          MEMONOW_RELEASE_CERT_SHA256: ${{ vars.MEMONOW_RELEASE_CERT_SHA256 }}
        run: python3 tools/prepare-signing.py
      - name: Build and verify signed release
        id: verify
        env:
          MEMONOW_RELEASE_STORE_PASSWORD: ${{ secrets.MEMONOW_RELEASE_STORE_PASSWORD }}
          MEMONOW_RELEASE_KEY_ALIAS: ${{ secrets.MEMONOW_RELEASE_KEY_ALIAS }}
          MEMONOW_RELEASE_KEY_PASSWORD: ${{ secrets.MEMONOW_RELEASE_KEY_PASSWORD }}
          MEMONOW_RELEASE_CERT_SHA256: ${{ vars.MEMONOW_RELEASE_CERT_SHA256 }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ./gradlew --no-daemon --no-configuration-cache assembleRelease lintRelease
          python3 tools/release.py verify-apk --apk app/build/outputs/apk/release/app-release.apk
          python3 -c 'import os; from tools.release import fingerprint; print("certificate=" + fingerprint(os.environ["MEMONOW_RELEASE_CERT_SHA256"]))' >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/memonow-v${VERSION}.apk"
          (cd dist && sha256sum "memonow-v${VERSION}.apk" > "memonow-v${VERSION}.apk.sha256")
      - name: Remove private signing file
        if: always()
        run: rm -rf "$RUNNER_TEMP/memonow-signing"
      - name: Upload only verified public release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-${{ needs.plan.outputs.version }}
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error
          retention-days: 1

  distribute:
    name: ${{ needs.plan.outputs.mode == 'publish' && '正式版を公開する' || 'テスト候補を未公開Draftに置く' }}
    needs: [plan, validate, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install verification SDK
        run: JAVA_HOME="$JAVA_HOME_21_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
      - name: Download verified files from this run only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-${{ needs.plan.outputs.version }}
          path: dist
      - name: Verify uploaded APK and finish selected mode
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_MODE: ${{ needs.plan.outputs.mode }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          PUBLIC_CERT_SHA256: ${{ needs.sign.outputs.certificate }}
        run: python3 tools/distribute.py

  report-failure:
    needs: [plan, validate, sign, distribute]
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-24.04
    steps:
      - name: Report failed release pipeline
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: echo "## failed — v${VERSION} — inspect failed job and any existing tag/Draft before retrying" >> "$GITHUB_STEP_SUMMARY"
